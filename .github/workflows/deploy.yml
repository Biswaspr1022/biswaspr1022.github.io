name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A4C5D2: ${{ secrets.A4C5D2 }}
          B8FEF7: ${{ secrets.B8FEF7 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A4C5D2', '')
          tag_b = os.environ.get('B8FEF7', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- ea10251e564e359adf45bbce98681a2fc80e -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- b71986346e20171bdee0b9d5ce74 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
